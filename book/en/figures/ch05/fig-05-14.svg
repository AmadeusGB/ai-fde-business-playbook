 </g><text x="252.0" y="58.947" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="14.000000000000002" text-anchor="middle" id="text_1"><tspan x="252.0" dy="0">Agree together: task, period, quality, version</tspan></text><text x="132.3" y="164.289" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="15.0" text-anchor="middle" id="text_2"><tspan x="132.3" dy="0">Original-process</tspan><tspan x="132.3" dy="17.7">baseline</tspan></text><text x="132.3" y="221.896" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" id="text_3"><tspan x="132.3" dy="0">Separate handling, waiting,</tspan><tspan x="132.3" dy="14.16">and rework; retain unfinished</tspan><tspan x="132.3" dy="14.16">tasks</tspan></text><text x="371.7" y="173.139" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="15.0" text-anchor="middle" id="text_4"><tspan x="371.7" dy="0">Controlled trial</tspan></text><text x="371.7" y="221.896" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" id="text_5"><tspan x="371.7" dy="0">Same definitions; record added</tspan><tspan x="371.7" dy="14.16">review, exceptions, and</tspan><tspan x="371.7" dy="14.16">support</tspan></text><text x="252.0" y="395.008" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" id="text_6"><tspan x="252.0" dy="0">Before comparing: has scope or task difficulty changed?</tspan></text></svg>
