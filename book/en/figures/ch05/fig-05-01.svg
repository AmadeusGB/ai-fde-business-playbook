h errors require an</tspan><tspan x="320" dy="14.16">immediate stop?</tspan></text><text x="31.752" y="320.048" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="start" id="text_11"><tspan x="31.752" dy="0">Define measurement details</tspan><tspan x="31.752" dy="14.16">together with the target</tspan></text></svg>