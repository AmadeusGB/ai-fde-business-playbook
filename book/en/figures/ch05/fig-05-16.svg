 </g><text x="22.176" y="97.744" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" id="text_1"><tspan x="22.176" dy="0">Unauthorized action or</tspan><tspan x="22.176" dy="14.16">serious exception</tspan></text><text x="266.364" y="85.453" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="start" id="text_2"><tspan x="266.364" dy="0">Pause affected actions first</tspan></text><text x="266.364" y="139.782" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" id="text_3"><tspan x="266.364" dy="0">Assess impact; arrange takeover</tspan></text><text x="22.176" y="219.308" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" id="text_4"><tspan x="22.176" dy="0">Repairable information or</tspan><tspan x="22.176" dy="14.16">program defect</tspan></text><text x="266.364" y="207.017" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="start" id="text_5"><tspan x="266.364" dy="0">Repair within scope and retest</tspan></text><text x="266.364" y="261.345" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" id="text_6"><tspan x="266.364" dy="0">Specify resources and deadline</tspan></text><text x="22.176" y="340.872" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" id="text_7"><tspan x="22.176" dy="0">Economic assumptions no</tspan><tspan x="22.176" dy="14.16">longer hold</tspan></text><text x="266.364" y="328.58" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="start" id="text_8"><tspan x="266.364" dy="0">Compare alternatives again</tspan></text><text x="266.364" y="375.829" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" id="text_9"><tspan x="266.364" dy="0">Update budget and restart</tspan><tspan x="266.364" dy="14.16">conditions</tspan></text></svg>
