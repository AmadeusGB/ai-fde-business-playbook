<text x="18.271" y="34.178" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="18.271" dy="0">Follow the task</tspan></text><text x="230.000" y="33.069" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="230.000" dy="0">Find unowned stages</tspan></text><text x="57.807" y="93.539" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="57.807" dy="0">Responsibilities complete and</tspan><tspan x="57.807" dy="12.0">validated</tspan></text><text x="208.765" y="96.170" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="208.765" dy="0">Operate within approved scope</tspan></text><text x="57.807" y="154.795" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="57.807" dy="0">Gaps can be specifically filled</tspan></text><text x="208.765" y="154.425" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="208.765" dy="0">Agree people and materials first</tspan></text><text x="57.807" y="210.050" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="57.807" dy="0">Critical obligations have no</tspan><tspan x="57.807" dy="12.0">owner</tspan></text><text x="208.765" y="212.680" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="208.765" dy="0">Revise the plan or stop</tspan></text></svg>