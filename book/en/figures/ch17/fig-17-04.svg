<text x="18.271" y="31.568" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="18.271" dy="0">Task enters</tspan></text><text x="136.881" y="31.199" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="136.881" dy="0">Match current rule and applicable conditions</tspan></text><text x="18.271" y="85.589" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Complete conditions; authorized</tspan><tspan x="18.271" dy="11.4">action</tspan></text><text x="194.388" y="85.589" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="194.388" dy="0">Generate result → Business receives</tspan><tspan x="194.388" dy="11.4">and records</tspan></text><text x="18.271" y="134.648" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Missing materials or low</tspan><tspan x="18.271" dy="11.4">confidence</tspan></text><text x="194.388" y="134.648" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="194.388" dy="0">Generate missing-materials list →</tspan><tspan x="194.388" dy="11.4">Assign reviewer</tspan></text><text x="18.271" y="186.558" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Rule conflict or outside scope</tspan></text><text x="194.388" y="183.708" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="194.388" dy="0">Pause action → Refer to approver for</tspan><tspan x="194.388" dy="11.4">decision</tspan></text><text x="18.271" y="232.768" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Counterexample or version</tspan><tspan x="18.271" dy="11.4">change</tspan></text><text x="194.388" y="232.768" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="194.388" dy="0">Mark affected scope → Pause or</tspan><tspan x="194.388" dy="11.4">narrow scope</tspan></text><text x="18.271" y="289.877" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="18.271" dy="0">Approver decides</tspan></text><text x="18.271" y="329.462" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Retain rule</tspan></text><text x="108.127" y="329.277" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="108.127" dy="0">Explain why it still applies</tspan></text><text x="18.271" y="362.292" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Limited</tspan><tspan x="18.271" dy="11.4">revision</tspan></text><text x="108.127" y="362.107" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="108.127" dy="0">New version, effective date, affected tasks, revalidation</tspan><tspan x="108.127" dy="11.4">samples</tspan></text><text x="18.271" y="400.821" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="18.271" dy="0">Withdraw rule</tspan></text><text x="108.127" y="397.787" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="9.5" text-anchor="start"><tspan x="108.127" dy="0">Stop new tasks, handle existing work, retain alternative</tspan><tspan x="108.127" dy="11.4">process</tspan></text><text x="208.765" y="445.606" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="start"><tspan x="208.765" dy="0">Role updates and revalidates</tspan></text></svg>