 </g><text x="18.271" y="43.607" fill="#24564b" font-family="Arial, Helvetica, sans-serif" font-size="12.0" text-anchor="start" id="text_1"><tspan x="18.271" dy="0">Compare current options</tspan></text><text x="356" y="29.802" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="end" id="text_2"><tspan x="356" dy="0">Consider</tspan><tspan x="356" dy="12.39">resources</tspan><tspan x="356" dy="12.39">occupied too</tspan></text><text x="57.807" y="116.976" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" id="text_3"><tspan x="57.807" dy="0">Evidence and takeover</tspan><tspan x="57.807" dy="12.39">ready</tspan></text><text x="208.765" y="116.504" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" id="text_4"><tspan x="208.765" dy="0">Test within the agreed</tspan><tspan x="208.765" dy="12.39">scope</tspan></text><text x="57.807" y="191.302" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" id="text_5"><tspan x="57.807" dy="0">Gaps can be filled on</tspan><tspan x="57.807" dy="12.39">time</tspan></text><text x="208.765" y="190.83" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" id="text_6"><tspan x="208.765" dy="0">Establish prerequisites</tspan><tspan x="208.765" dy="12.39">first</tspan></text><text x="57.807" y="265.627" fill="#252c29" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" id="text_7"><tspan x="57.807" dy="0">Necessary conditions</tspan><tspan x="57.807" dy="12.39">unmet</tspan></text><text x="208.765" y="265.155" fill="#58615c" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="start" id="text_8"><tspan x="208.765" dy="0">Choose another task or</tspan><tspan x="208.765" dy="12.39">defer</tspan></text></svg>
